[package]
name = "i-nix"
version = "0.1.0"
edition = "2024"
authors = ["stefan-hacks <i-nix@stefanhacks.dev>"]
description = "Imperative UX for declarative Nix/NixOS systems"
license = "MIT"
repository = "https://github.com/stefan-hacks/i-nix"
keywords = ["nix", "nixos", "declarative", "package-manager", "home-manager"]
categories = ["command-line-utilities", "os"]

[[bin]]
name = "i-nix"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "color", "suggestions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rnix = "0.14"
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
colored = "2.1"
toml = "0.8"
directories = "6.0"
walkdir = "2.5"
tempfile = "3.27"
which = "7.0"
regex = "1.11"
shellexpand = "3.1"
chrono = "0.4"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3.27"
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
debug = true
opt-level = 1
